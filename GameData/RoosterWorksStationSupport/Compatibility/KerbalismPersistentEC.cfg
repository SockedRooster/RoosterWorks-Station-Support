// Experimental in-place compatibility patch for Kerbalism and B9PartSwitch.
// v1.0.9 development test: add ElectricCharge to each ORIGINAL part prefab.
// No cloned parts, no extra VAB entries, no resource capacity rebalance.
//
// Kerbalism simulates unloaded craft using resource snapshots. Original support
// tanks only declare EC in B9_TANK_TYPE nodes, rather than in stock part prefab
// RESOURCE nodes. This seeds stock EC in the prefab; B9PartSwitch keeps control
// of the nine storage subtypes and their current EC/MonoPropellant capacities.
//
// NOTE: This is a candidate, not an in-game-confirmed repair. Because B9 still
// manages EC amounts when switching, an actual unloaded-vessel test is required.
// Use a backup save; do not distribute as a verified stable fix yet.

// RW_HexSupport_Medium: Standard 240 EC + 40 MP; Battery Only 2000 EC.
@PART[RW_HexSupport_Medium]:HAS[!RESOURCE[ElectricCharge]]:NEEDS[Kerbalism&B9PartSwitch]:AFTER[RoosterWorksStationSupport]
{
    RESOURCE
    {
        name = ElectricCharge
        amount = 240
        maxAmount = 240
    }
}

